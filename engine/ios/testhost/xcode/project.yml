# XcodeGen spec for the engine test host as a normal Xcode app, so it can be
# run where the script-built host cannot: on an iPhone/iPad, and on an
# Apple-silicon Mac ("My Mac (Designed for iPad)"), with Xcode's automatic
# signing. Generated by tools/ios-xcode-project.sh (which stages the fixture
# bundles and the libraries first); the .xcodeproj is not committed.
# Paths are relative to this file (engine/ios/testhost/xcode).
name: RniTestHost
options:
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${RNI_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  RniTestHost:
    type: application
    platform: iOS
    sources:
      - path: ..
        includes: ["*.mm", "*.h"]
        excludes: ["uitests/**", "xcode/**"]
      - path: Bundles
        buildPhase: resources
    dependencies:
      - framework: ../../../third_party/hermes-ios/hermesvm.xcframework
        embed: true
        codeSign: true
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: RniTestHost
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: TestHostSceneDelegate
    settings:
      base:
        PRODUCT_NAME: RniTestHost
        PRODUCT_BUNDLE_IDENTIFIER: ${RNI_IOS_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../..
          - $(SRCROOT)/..
          - $(SRCROOT)/../../../third_party/impeller-sdk-ios-arm64/include
        # The engine (tools/engine-build-ios.sh) and Impeller
        # (tools/sdk-fetch-ios.sh) per SDK; -lc++abi because libimpeller.a is
        # staged without Flutter's C++ exception runtime.
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - $(SRCROOT)/../../../build-ios-device/librni_ios_all.a
          - $(SRCROOT)/../../../third_party/impeller-sdk-ios-arm64/lib/libimpeller.a
          - -lc++abi
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - $(SRCROOT)/../../../build-ios-simulator/librni_ios_all.a
          - $(SRCROOT)/../../../third_party/impeller-sdk-ios-simulator-arm64/lib/libimpeller.a
          - -lc++abi
schemes:
  RniTestHost:
    build:
      targets:
        RniTestHost: all
    run:
      config: Debug
      commandLineArguments:
        "--test=engine": true
        "--bundle=ios-smoke.jsbundle": true
        "--app=IosSmoke": true
        "--log-file=1": true
