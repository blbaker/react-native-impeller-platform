# Builds the prebuilt engine for each platform a release publishes, and hands
# each one to the caller as an artifact.
#
# Called by release.yml, which unpacks these builds into packages-engine/ and
# refuses to publish unless every engine package carries a binary for its own
# platform (tools/ci-release-meta.sh, RNI_REQUIRE_ENGINE_BINARIES=1). Also runs
# on any pull request that touches the engine or how it is built, so a change
# that breaks the macOS build shows up in review instead of on a version tag.
#
# Windows builds natively under Git Bash with the MSVC environment loaded
# (tools/engine-build-win-native.sh). It used to be built only by hand on one
# machine, from WSL through cmd.exe, so no release could include it.
name: engines

on:
  workflow_call:
  pull_request:
    paths:
      - 'engine/**'
      - 'packages-engine/**'
      - 'tools/engine-build.sh'
      - 'tools/ci-engine-pack.sh'
      - 'tools/mutation-verify-engine-pack.sh'
      - 'tools/glfw-fetch.sh'
      - 'tools/hermes-build.sh'
      - 'tools/sdk-fetch.sh'
      - 'tools/sdk-fetch-darwin.sh'
      - 'tools/sdk-fetch-win.sh'
      - 'tools/engine-build-win-native.sh'
      - 'tools/engine-build-win-stage.sh'
      - 'tools/apply-win-patches.sh'
      - '.gitattributes'
      - 'tools/sdk-fetch-custom.sh'
      - 'tools/angle-fetch.sh'
      - '.github/workflows/engines.yml'
      - 'tools/ci-idle-commit-paint.sh'
      - 'tools/mutation-verify-idle-commit-paint.sh'
      - 'fixtures/idle-commit-paint/**'
      - 'tools/ci-unpresented-damage.sh'
      - 'tools/mutation-verify-unpresented-damage.sh'
      - 'tools/unpresented-damage-test.cpp'
      - 'tools/ci-gradient-cache.sh'
      - 'tools/mutation-verify-gradient-cache.sh'
      - 'tools/gradient-cache-measure.py'
      - 'fixtures/eng48-gradient-cache/**'
      - 'tools/ci-app-chdir.sh'
      - 'fixtures/eng49-app-chdir/**'

permissions:
  contents: read

# Same reasoning as ci.yml: superseding a pull-request run is fine, but a cold
# Hermes build that gets cancelled never saves its cache.
concurrency:
  group: engines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: engine ${{ matrix.triple }}
    strategy:
      # One platform failing must not cancel the other: the useful report is
      # which platforms build, not that something failed first.
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64
            platform: linux
            arch: x64
            os: ubuntu-24.04
          - triple: darwin-arm64
            platform: darwin
            arch: arm64
            os: macos-15
          - triple: win32-x64
            platform: win32
            arch: x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    # A cold run compiles Hermes from source. See the timeout note in ci.yml.
    timeout-minutes: 360
    # Git Bash on Windows; the build scripts are bash on every platform.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Same list as ci.yml's, for the same reasons.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libicu-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri libglvnd-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      # Xcode's toolchain and CMake are on the macOS image; Ninja is not
      # guaranteed to be.
      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake --version | head -1
          ninja --version

      # cl, link and dumpbin on PATH for the steps that follow. Pinned to the
      # v1.13.0 commit: third-party code running in the job that produces a
      # published binary.
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64

      - name: System dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v ninja >/dev/null || choco install ninja -y --no-progress
          cmake --version | head -1
          ninja --version
          cl 2>&1 | head -1

      # The same key formula as ci.yml, so the Linux entry is shared with the
      # gates job rather than built twice. Hermes's build output is
      # OS-specific, and runner.os keeps the three entries apart.
      - name: Cache Hermes (source + build)
        uses: actions/cache@v4
        with:
          path: |
            engine/third_party/hermes
            engine/third_party/hermes-build
          key: hermes-v2-${{ runner.os }}-${{ hashFiles('engine/rn/package-lock.json') }}

      - name: Build the engine
        run: bash tools/engine-build.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Show what was built
        run: |
          ls -la "packages-engine/engine-${{ matrix.triple }}/bin"
          if command -v file >/dev/null; then
            file "packages-engine/engine-${{ matrix.triple }}"/bin/rn-impeller*
          fi

      # engine-build.sh already ran tools/ci-engine-pack.sh on the package.
      # This proves that gate can still fail on this runner: the 0.1.0 shape
      # (hermesvm.framework, symlinks dropped by npm pack) must fail codesign
      # inside an .app, and a missing or misnamed dylib must fail the
      # dependency arm. Works on a copy; the staged package is not touched.
      - name: Prove the pack gate can fail (macOS)
        if: runner.os == 'macOS'
        run: bash tools/mutation-verify-engine-pack.sh "packages-engine/engine-${{ matrix.triple }}"

      # A whole-screen JS commit on an IDLE windowed loop must be on screen
      # 300 ms later (fixtures/idle-commit-paint). Runs here because the loss it
      # guards was darwin-only: Metal drawables, CVDisplayLink pacing and the
      # AppKit event loop exist on no Linux runner. A real window on the
      # runner's own session; node-free (committed bundle, staged binary).
      # Three runs x four swaps, because the defect class is a race.
      - name: Idle commit reaches the screen (macOS windowed)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
          ICP_DIAG: '1'
        run: |
          rc=0
          for arm in light heavy click; do
            for i in 1 2; do
              echo "=== $arm run $i ==="
              ICP_MODE=$arm bash tools/ci-idle-commit-paint.sh || rc=1
            done
          done
          echo "=== heavy, 1600x900 ==="
          ICP_MODE=heavy ICP_WIDTH=1600 ICP_HEIGHT=900 bash tools/ci-idle-commit-paint.sh || rc=1
          exit $rc

      # The arm that fails on 0.6.0's loop: each swap's own frame is lost
      # after its request was consumed (a nil drawable, a failed draw), and
      # the loop must ask again (host/UnpresentedDamage.h). The mutation run
      # proves the arm fails with each part of the fix removed (M4/M5/M6),
      # here on Metal + CVDisplayLink.
      - name: Lost frame still reaches the screen (macOS windowed)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
        run: |
          rc=0
          echo "=== light, lose=1 ==="
          ICP_LOSE_FRAMES=1 bash tools/ci-idle-commit-paint.sh || rc=1
          # Three losses in a row cost three display-link-paced loop cycles
          # (~100 ms each on this VM), so this arm proves the loop keeps
          # re-asking through consecutive losses, with a looser bound.
          echo "=== light, lose=3, capture at 800 ms ==="
          ICP_LOSE_FRAMES=3 ICP_CAPTURE_DELAY_MS=800 bash tools/ci-idle-commit-paint.sh || rc=1
          # Heavy + one loss: the 100 ms simulated drawable hold, one ~100 ms
          # loop cycle on this VM and a heavy raster. Measured on 12 runs
          # (PRs #35-#41): 100-290 ms from commit to screen, and one run
          # (#41, attempt 1) past 300 ms, so this arm captures at 500 ms.
          # The defect it guards never presents until the next input (>= 1.3 s
          # later) and M6 re-asks only after the 1000 ms idle budget, so 500
          # still fails all three mutants (the heavy@500 run below).
          echo "=== heavy, lose=1, capture at 500 ms ==="
          ICP_MODE=heavy ICP_LOSE_FRAMES=1 ICP_CAPTURE_DELAY_MS=500 bash tools/ci-idle-commit-paint.sh || rc=1
          echo "=== mutation verify ==="
          bash tools/mutation-verify-idle-commit-paint.sh || rc=1
          echo "=== mutation verify, heavy @ 500 ms ==="
          ICP_MODE=heavy ICP_CAPTURE_DELAY_MS=500 bash tools/mutation-verify-idle-commit-paint.sh || rc=1
          # The re-ask schedule on a simulated clock, with Apple clang: the
          # orderings the windowed arms only see when runner timing allows
          # (the PR #35 run lost the race this replays).
          echo "=== re-ask schedule (CPU) ==="
          bash tools/ci-unpresented-damage.sh || rc=1
          bash tools/mutation-verify-unpresented-damage.sh || rc=1
          exit $rc

      # ENG-43: one mouse drag selects across several <Text selectable>, on
      # the darwin binary the npm package ships (the Mac's TEXT-SELECT-1
      # drags plus six more; node-free, committed bundle). darwin glyph
      # widths differ from linux, so this is the run that proves the
      # copy strings on the platform that reported the bug.
      - name: Text selection across paragraphs (macOS)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
        run: bash tools/ci-text-select.sh

      # ENG-46: a key with nothing focused reaches the app's root
      # <View onKeyDown> (Jim's Cmd+Shift+B), on the darwin binary the npm
      # package ships. Windowed (the key hooks live in the window loop);
      # node-free, committed bundle.
      - name: Keys with nothing focused reach the app root (macOS)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
        run: bash tools/ci-key-root.sh

      # ENG-48: two same-size gradient <Svg>s on the per-<Svg> supersample
      # path each paint their OWN gradient, on the darwin binary the npm
      # package ships (supersample defaults to 4 there, the platform that
      # reported it). Headless, node-free, committed bundle.
      - name: Gradient Svgs keep their own picture (macOS)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
        run: bash tools/ci-gradient-cache.sh

      # ENG-49: a windowed engine inside an .app keeps the caller's working
      # directory (GLFW_COCOA_CHDIR_RESOURCES off), so a relative --screenshot
      # lands in the cwd, not in Contents/Resources. Windowed; node-free,
      # committed bundle. npm 0.8.5 (no fix) is the control: arm C must see it
      # chdir, and the whole gate run on it must FAIL at arm B.
      - name: Windowed engine inside an .app keeps the cwd (macOS)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
        run: |
          ctl="$RUNNER_TEMP/eng49-control"
          mkdir -p "$ctl"
          ( cd "$ctl" && npm pack --silent @blbaker/react-native-impeller-platform-engine-darwin-arm64@0.8.5 >/dev/null && tar xzf ./*.tgz )
          export RNI_CONTROL_BIN="$ctl/package/bin/rn-impeller"
          bash tools/ci-app-chdir.sh
          echo "=== the same gate on 0.8.5 must fail at arm B ==="
          if out="$(RNI_BIN="$RNI_CONTROL_BIN" bash tools/ci-app-chdir.sh 2>&1)"; then
            echo "$out"; echo "::error::ci-app-chdir.sh passed on npm 0.8.5, which chdirs"; exit 1
          fi
          echo "$out" | tail -4
          grep -q 'APP_CHDIR_GATE_FAIL: B: the windowed engine chdir' <<< "$out" \
            || { echo "::error::ci-app-chdir.sh failed on 0.8.5, but not at arm B"; exit 1; }

      # ENG-47: RNViewShot on native Metal. The darwin window renders on
      # Metal, so arms A-D read every capture back through
      # SnapshotReadbackMetal.mm (readback=metal asserted per arm), M is
      # headless --backend metal. Then the darwin mutants (arm M): no Metal
      # readback, BGRA unswapped, rows flipped.
      # Arm H (darwin default headless = ANGLE GL, SnapshotReadbackGl.cpp) is
      # left out here: ENG-47 does not touch the GL readback, H had never run
      # on darwin, and its first run there failed "non-opaque pixels over an
      # opaque view". That is a separate darwin-GL gap (issue #47);
      # linux still runs H on every push.
      - name: View snapshots on Metal (macOS windowed + headless metal)
        if: runner.os == 'macOS'
        env:
          RNI_BIN: packages-engine/engine-darwin-arm64/bin/rn-impeller
          SNAPSHOT_ARMS: A B C D M
        run: bash tools/ci-snapshot.sh

      - name: Prove the Metal snapshot gate can fail (macOS)
        if: runner.os == 'macOS'
        run: |
          bash tools/mutation-verify-snapshot-metal.sh
          # The mutants rebuilt the staged engine; the restore step rebuilt it
          # clean, and this run proves the artifact below is the clean one.
          RNI_BIN=packages-engine/engine-darwin-arm64/bin/rn-impeller SNAPSHOT_ARMS=M bash tools/ci-snapshot.sh

      # ⛔ TAR IT FIRST. upload-artifact drops file modes and does not keep
      # symlinks, so uploading the folder directly would hand the release job
      # an rn-impeller with no exec bit (EACCES at spawn). A tarball keeps the
      # mode. (Hermes ships as a flat dylib, so the darwin package has no
      # symlinks to lose; tools/ci-engine-pack.sh keeps it that way.)
      - name: Pack the staged engine package
        run: tar -C packages-engine -czf "engine-${{ matrix.triple }}.tgz" "engine-${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.triple }}
          path: engine-${{ matrix.triple }}.tgz
          if-no-files-found: error
          retention-days: 7
