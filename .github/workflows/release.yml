# Publish, and ONLY on a version tag.
#
# The blast radius of this file is permanent: an npm version number is burned
# forever, and a package made public can be deprecated but never made private
# again. So the safety here is structural rather than procedural —
#
#   1. It cannot be reached by pushing a branch. Only `refs/tags/v*`.
#   2. It cannot run before the gates: `needs: gates`, and `gates` is the SAME
#      workflow a pull request runs, called rather than copied.
#   3. It is DRY BY DEFAULT. `npm publish --dry-run` runs on every tag and
#      exercises packing and file lists without creating anything. The real
#      publish is a separate step behind a repository variable, so arming the
#      pipeline is a settings change with an audit trail, not a commit.
#   4. It holds NO npm token. The publish job authenticates with npm trusted
#      publishing: GitHub mints a short-lived OIDC token for this workflow
#      file, and npm exchanges it for a one-time publish credential. Provenance
#      is attached automatically. There is no long-lived secret to leak.
#   5. A publish is STAGED, not live. `npm stage publish` puts each version in
#      npm's staging area, and it goes public only when a maintainer approves
#      it with 2FA on npmjs.com (or `npm stage approve`). The trusted publisher
#      for each package should allow staged publishing only.
#
# ⛔ PUBLISHING IS LOCKED, AND THE LOCK IS NOW THE ONLY THING HOLDING.
# Baker's direction, 2026-08-15: the packages go PUBLIC, and NOTHING publishes
# until he gives explicit direction to ungate it.
#
# Read that in the context of what just changed. Until today a second,
# accidental backstop was doing most of the work: the packages were scoped and
# restricted, which npm only permits on a PAID plan, so a publish from this
# free account was refused with a 402 no matter what any file said. Public
# scoped packages are free to publish. That backstop is GONE.
#
#   RNI_PUBLISH_ENABLED is now the ONLY thing between a version tag and a
#   permanent public registry entry. Do not set it, and do not add a step that
#   reads a different variable, until Baker says so.
#
# An npm publish cannot be undone in either direction: a public package can be
# deprecated but never un-published, and the tarball stays fetchable forever.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Not a copy of ci.yml — a call INTO it. One implementation of "the gates",
  # exactly like tools/assert-fixture.js is one implementation of "the
  # assertions". A release must never run an older idea of what passing means.
  gates:
    uses: ./.github/workflows/ci.yml

  # The prebuilt engine for each platform, built on that platform's runner.
  engines:
    uses: ./.github/workflows/engines.yml

  publish:
    needs: [gates, engines]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # ⚠️ THIS LINE IS NOT PROTECTION YET — IT IS A PLACEHOLDER WITH A NAME.
    # A GitHub environment only gates a job once it EXISTS and has a required
    # reviewer configured. Verified against the live repo on 2026-08-15: the
    # environments list is empty, and creating one needs permissions this
    # token does not have (403). Referencing a nonexistent environment does not
    # fail the job — GitHub creates it implicitly with no rules — so this reads
    # like a second lock and currently is not one.
    #
    # ⛔ THE ONLY REAL LOCK IS `vars.RNI_PUBLISH_ENABLED` ON THE STEP BELOW.
    # Baker: to add the human-approval layer, create an environment named
    # npm-publish (Settings → Environments) and add yourself as a required
    # reviewer. Then a publish pauses for an explicit approval click in
    # addition to the variable.
    environment: npm-publish
    # Job-level, so only this job can mint an OIDC token. The trusted publisher
    # on npmjs.com names this file (release.yml) and this environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+ and staged publishing 11.15.0+.
      # The npm bundled with Node 24 can be older than that, so pin one.
      - name: Pin npm for trusted and staged publishing
        run: |
          npm install -g npm@11.21.1
          npm --version

      # ⛔ THE TAG MUST MATCH THE VERSION IN THE PACKAGE.
      # Publishing v0.1.0's artifact under the v0.2.0 tag is unrecoverable: the
      # version is consumed and the tag now points at something that was never
      # released under it. Free to catch here, impossible to fix after.
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package/package.json').version")"
          echo "tag=${TAG} package=${PKG}"
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag v${TAG} does not match package version ${PKG}"
            exit 1
          }

      # The engines are built on their own runners by engines.yml, which
      # tars each staged package so the exec bit and symlinks survive.
      - name: Download the engine builds
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: engine-artifacts
          merge-multiple: true

      - name: Unpack the engine builds
        run: |
          for t in engine-artifacts/engine-*.tgz; do
            tar -xzf "$t" -C packages-engine
          done
          ls -la packages-engine/*/bin

      # ⛔ EVERY ENGINE PACKAGE MUST CARRY ITS ENGINE, OR NOTHING PUBLISHES.
      # packages-engine/*/bin is gitignored, so without the builds above this
      # job would publish engine packages holding only a README. The binary
      # check reads each binary's own header (right OS, right CPU), its exec
      # bit, and what `npm pack` would actually ship. A platform whose build
      # is missing fails it by name, which is the point: the main package pins
      # all three, and npm skips a missing optional dependency silently.
      # tools/ci-workflows.sh (W15) keeps this step here.
      - name: Release metadata, with every engine binary required
        env:
          RNI_REQUIRE_ENGINE_BINARIES: '1'
        run: bash tools/ci-release-meta.sh

      # Always runs. Exercises packing and the shipped file list on every tag,
      # so the publish path cannot rot between releases while looking fine.
      - name: Publish (dry run)
        run: |
          npm publish ./package --dry-run
          for p in packages-engine/*/; do
            npm publish "$p" --dry-run
          done

      # The only step that changes the outside world. Two independent things
      # must be true: a version tag was pushed, AND someone set the repository
      # variable. Neither alone is enough, and even then nothing goes public
      # until a maintainer approves each staged version with 2FA.
      #
      # Engines are staged before the main package, so they can be approved
      # first: the main package pins them exactly, and approving it while its
      # engines are still staged would give users an install with no engine.
      - name: Publish (staged, approved by a maintainer on npmjs.com)
        if: vars.RNI_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          for p in packages-engine/*/; do
            (cd "$p" && npm stage publish)
          done
          (cd package && npm stage publish)

      - name: Publish is disabled
        if: vars.RNI_PUBLISH_ENABLED != 'true'
        run: |
          echo "::notice::Dry run only — set repository variable"
          echo "::notice::RNI_PUBLISH_ENABLED=true to publish for real."
