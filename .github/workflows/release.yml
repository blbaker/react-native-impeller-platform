# Publish, and ONLY on a version tag.
#
# The blast radius of this file is permanent: an npm version number is burned
# forever, and a package made public can be deprecated but never made private
# again. So the safety here is structural rather than procedural —
#
#   1. It cannot be reached by pushing a branch. Only `refs/tags/v*`.
#   2. It cannot run before the gates: `needs: gates`, and `gates` is the SAME
#      workflow a pull request runs, called rather than copied.
#   3. It is DRY BY DEFAULT. `npm publish --dry-run` runs on every tag and
#      exercises the whole path — auth, packing, file lists — without creating
#      anything. The real publish is a separate step behind a repository
#      variable, so arming the pipeline is a settings change with an audit
#      trail, not a commit.
#
# ⛔ PUBLISHING IS LOCKED, AND THE LOCK IS NOW THE ONLY THING HOLDING.
# Baker's direction, 2026-08-15: the packages go PUBLIC, and NOTHING publishes
# until he gives explicit direction to ungate it.
#
# Read that in the context of what just changed. Until today a second,
# accidental backstop was doing most of the work: the packages were scoped and
# restricted, which npm only permits on a PAID plan, so a publish from this
# free account was refused with a 402 no matter what any file said. Public
# scoped packages are free to publish. That backstop is GONE.
#
#   RNI_PUBLISH_ENABLED is now the ONLY thing between a version tag and a
#   permanent public registry entry. Do not set it, and do not add a step that
#   reads a different variable, until Baker says so.
#
# An npm publish cannot be undone in either direction: a public package can be
# deprecated but never un-published, and the tarball stays fetchable forever.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Not a copy of ci.yml — a call INTO it. One implementation of "the gates",
  # exactly like tools/assert-fixture.js is one implementation of "the
  # assertions". A release must never run an older idea of what passing means.
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # ⚠️ THIS LINE IS NOT PROTECTION YET — IT IS A PLACEHOLDER WITH A NAME.
    # A GitHub environment only gates a job once it EXISTS and has a required
    # reviewer configured. Verified against the live repo on 2026-08-15: the
    # environments list is empty, and creating one needs permissions this
    # token does not have (403). Referencing a nonexistent environment does not
    # fail the job — GitHub creates it implicitly with no rules — so this reads
    # like a second lock and currently is not one.
    #
    # ⛔ THE ONLY REAL LOCK IS `vars.RNI_PUBLISH_ENABLED` ON THE STEP BELOW.
    # Baker: to add the human-approval layer, create an environment named
    # npm-publish (Settings → Environments) and add yourself as a required
    # reviewer. Then a publish pauses for an explicit approval click in
    # addition to the variable.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # ⛔ THE TAG MUST MATCH THE VERSION IN THE PACKAGE.
      # Publishing v0.1.0's artifact under the v0.2.0 tag is unrecoverable: the
      # version is consumed and the tag now points at something that was never
      # released under it. Free to catch here, impossible to fix after.
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package/package.json').version")"
          echo "tag=${TAG} package=${PKG}"
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag v${TAG} does not match package version ${PKG}"
            exit 1
          }

      # ⛔ THE ENGINE BINARIES ARE NOT BUILT HERE, AND THAT IS THE POINT.
      # A Linux runner cannot produce the win32 or darwin engines, so publishing
      # from a green Linux job would ship a host package whose declared
      # optionalDependencies point at versions that do not exist — the exact
      # silent-skip defect ci-release-meta.sh exists to catch (npm skips a
      # missing optional dependency and exits 0). The gate is the guard: it
      # fails if package.json declares a platform that has no built package, so
      # this job can only ever publish a coherent set.
      - name: Release metadata
        run: bash tools/ci-release-meta.sh

      # Always runs. Exercises auth, packing and the shipped file list on every
      # tag, so the publish path cannot rot between releases while looking fine.
      - name: Publish (dry run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./package --dry-run
          for p in packages-engine/*/; do
            npm publish "$p" --dry-run
          done

      # The only step that changes the outside world. Two independent things
      # must be true: a version tag was pushed, AND someone set the repository
      # variable. Neither alone is enough.
      - name: Publish
        if: vars.RNI_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./package
          for p in packages-engine/*/; do
            npm publish "$p"
          done

      - name: Publish is disabled
        if: vars.RNI_PUBLISH_ENABLED != 'true'
        run: |
          echo "::notice::Dry run only — set repository variable"
          echo "::notice::RNI_PUBLISH_ENABLED=true to publish for real."
